[package]
name = "avero-cad-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core API, database, security and CAD services for the Avero CAD desktop application"

[lib]
name = "avero_cad_core"
path = "src/lib.rs"

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.9.5"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { version = "1.53.3", features = ["rt", "time", "macros"] }

# Windows builds use SChannel-backed TLS: no OpenSSL, NASM or CMake required.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
winreg = "0.56.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "gzip", "http2"] }

# Development and CI checks on Linux/macOS use rustls.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "gzip", "http2"] }
