[workspace]
members = ["src-tauri", "crates/avero-cad-core"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
